name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: qifxxzpnuxchnkowxzgp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Deploy telegram-auth
        run: supabase functions deploy telegram-auth --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy telegram-bot
        run: supabase functions deploy telegram-bot --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy plan-invite
        run: supabase functions deploy plan-invite --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Smoke-test deployed functions
        shell: bash
        run: |
          set -euo pipefail
          AUTH_URL="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/telegram-auth"
          BOT_URL="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/telegram-bot"

          headers="$(mktemp)"
          body="$(mktemp)"

          status="$(curl --fail-with-body -sS -o "$body" -D "$headers" -w "%{http_code}"             -X OPTIONS "$AUTH_URL"             -H "Origin: https://restsva-ui.github.io"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type,apikey")"
          test "$status" = "204"
          grep -Eqi '^access-control-max-age:[[:space:]]*86400[[:space:]]*$' "$headers"

          status="$(curl -sS -o "$body" -w "%{http_code}"             -X GET "$AUTH_URL")"
          test "$status" = "405"
          grep -Fq 'Method not allowed' "$body"

          status="$(curl -sS -o "$body" -w "%{http_code}"             -X POST "$AUTH_URL"             -H "Content-Type: application/json"             --data '{')"
          test "$status" = "400"
          grep -Fq 'Invalid JSON body' "$body"

          status="$(curl -sS -o "$body" -w "%{http_code}"             -X POST "$AUTH_URL"             -H "Content-Type: application/json"             --data '{}')"
          test "$status" = "400"
          grep -Fq 'initData is required' "$body"

          status="$(curl -sS -o "$body" -w "%{http_code}"             -X POST "$AUTH_URL"             -H "Content-Type: application/json"             --data '{"initData":"auth_date=1&user=%7B%22id%22%3A1%7D&hash=00"}')"
          test "$status" = "401"
          grep -Fq 'Invalid Telegram signature' "$body"

          status="$(curl -sS -o "$body" -w "%{http_code}"             -X POST "$BOT_URL"             -H "Content-Type: application/json"             --data '{}')"
          test "$status" = "401"

          echo "VYBE production Edge smoke tests passed."

      - name: Remove completed one-time branding worker
        if: contains(github.event.head_commit.message, '[brand-cleanup]')
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = `https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_ID}/functions/vybe-brand-fix-20261010`;
          const response = await fetch(url, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
          });
          if (!response.ok && response.status !== 404) {
            console.error(`Brand worker cleanup failed: HTTP ${response.status}`);
            process.exit(1);
          }
          console.log("One-time VYBE branding worker removed.");
          JS
