name: VYBE CI

on:
  push:
    branches: [main, hardening-0.9.47]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vybe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check interests-map.js
          node --check chat-media.js
          node --check chat-emoji.js
          node --check photo-viewer.js

      - name: Test chat emoji and fullscreen UI behavior
        run: |
          npm install --prefix /tmp/vybe-emoji-test jsdom@26.1.0 --no-audit --no-fund
          node scripts/test-chat-emoji.cjs /tmp/vybe-emoji-test
          node scripts/test-fullscreen-ui.cjs /tmp/vybe-emoji-test
          node scripts/test-profile-bio-ui.cjs /tmp/vybe-emoji-test

      - name: Test mandatory profile bio and API access boundaries
        run: |
          npx --yes esbuild@0.25.11 scripts/test-profile-bio-api.ts --bundle --platform=node --format=esm --outfile=/tmp/test-profile-bio-api.mjs
          node /tmp/test-profile-bio-api.mjs

      - name: Test interests and map privacy boundaries
        run: |
          npx --yes esbuild@0.25.11 scripts/test-discovery-preferences.ts --bundle --platform=node --format=esm --outfile=/tmp/test-discovery-preferences.mjs
          node /tmp/test-discovery-preferences.mjs

      - name: Test media and call access boundaries
        run: |
          npx --yes esbuild@0.25.11 scripts/test-chat-media.ts --bundle --platform=node --format=esm --outfile=/tmp/test-chat-media.mjs
          node /tmp/test-chat-media.mjs

      - name: Test native WebRTC audio and video transfer
        run: |
          npm install --prefix /tmp/vybe-rtc-test @roamhq/wrtc@0.10.0 --no-audit --no-fund
          node scripts/test-webrtc-loopback.mjs /tmp/vybe-rtc-test

      - name: Test Telegram initData validation
        run: |
          npx --yes esbuild@0.25.11 scripts/test-telegram-init-data.ts --bundle --platform=node --format=esm --outfile=/tmp/test-telegram-init-data.mjs
          node /tmp/test-telegram-init-data.mjs

      - name: Test Supabase service-key headers
        run: |
          npx --yes esbuild@0.25.11 scripts/test-supabase-service-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/test-supabase-service-auth.mjs
          node /tmp/test-supabase-service-auth.mjs

      - name: Test branded bot welcome and delivery fallback
        run: |
          npx --yes esbuild@0.25.11 scripts/test-bot-branding.ts --bundle --platform=node --format=esm --outfile=/tmp/test-bot-branding.mjs
          node /tmp/test-bot-branding.mjs

      - name: Run hardening invariants
        run: node scripts/verify-hardening.mjs

      - name: Verify migration catalog
        run: node scripts/verify-migrations.mjs

      - name: Type-check telegram-auth
        run: deno check supabase/functions/telegram-auth/index.ts

      - name: Parse and transpile telegram-auth
        run: npx --yes esbuild@0.25.11 supabase/functions/telegram-auth/index.ts --platform=neutral --format=esm --outfile=/tmp/telegram-auth.js

      - name: Type-check telegram-bot
        run: deno check supabase/functions/telegram-bot/index.ts

      - name: Parse and transpile telegram-bot
        run: npx --yes esbuild@0.25.11 supabase/functions/telegram-bot/index.ts --platform=neutral --format=esm --outfile=/tmp/telegram-bot.js
